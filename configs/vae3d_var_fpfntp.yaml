# ---------------------------------------------------------------------------
# vae3d_var_fpfntp.yaml — stage-1 of the 2026-10-20 direction: VAR FP/FN/TP triple-head.
# Same 2-channel [grayscale CT, broken mask] input and SAME data / degradation / split as
# vae3d_var_fpfn.yaml; the ONLY change is the decoder head width (3: FP, FN, TP) so the
# model emits the full error decomposition. Binary heads (independent sigmoids), per-map BCE.
# ---------------------------------------------------------------------------

_base_: "raos.yaml"

data:
  data_source: "precomputed"
  volumes_dir: "outputs/volumes"

vae3d:
  input_size: [64, 64, 64]
  bbox_margin: 0.10

vae3d_var:
  base_channels: 16
  num_embeddings: 512
  embedding_dim: 64
  input_size: [64, 64, 64]
  v_patch_nums: [1, 2, 3, 4]
  using_znorm: false
  beta: 0.25
  quant_resi: 0.5

loss:
  dice_weight: 1.0

train:
  batch_size: 8
  num_workers: 2
  lr: 0.0002
  epochs: 100
  seed: 42
  early_stop_patience: 15
  min_delta: 0.001
  recon_preview_every: 5
  device: "auto"
  cache_size: 24
  diag_every: 5
  diag_k: 20
  diag_seed: 42
