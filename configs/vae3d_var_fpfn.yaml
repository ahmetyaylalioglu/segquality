# ---------------------------------------------------------------------------
# vae3d_var_fpfn.yaml — Faz 3: FP/FN dual-head on the VAR multi-scale backbone.
# Same 2-channel [grayscale CT, broken mask] input and [FP, FN] output, and the SAME
# data / degradation / split as vae3d_imgcond_fpfn.yaml. The ONLY difference is the
# backbone quantizer: the model is built from a `vae3d_var` block (multi-scale
# residual VQ) instead of `vae3d_vq` (single-scale VQ). Binary head only.
# ---------------------------------------------------------------------------

_base_: "raos.yaml"

data:
  data_source: "precomputed"
  volumes_dir: "outputs/volumes"

vae3d:
  input_size: [64, 64, 64]
  bbox_margin: 0.10

vae3d_var:
  base_channels: 16
  num_embeddings: 512
  embedding_dim: 64
  input_size: [64, 64, 64]
  v_patch_nums: [1, 2, 3, 4]
  using_znorm: false
  beta: 0.25
  quant_resi: 0.5

loss:
  dice_weight: 1.0

train:
  batch_size: 8
  num_workers: 2
  lr: 0.0002
  epochs: 100
  seed: 42
  early_stop_patience: 15
  min_delta: 0.001
  recon_preview_every: 5
  device: "auto"
  cache_size: 24
  diag_every: 5
  diag_k: 20
  diag_seed: 42
